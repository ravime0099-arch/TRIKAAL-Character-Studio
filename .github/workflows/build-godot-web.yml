name: Build TRIKAAL playable Web game
on:
  push:
    branches: [main]
    paths:
      - 'godot-game/**'
      - '.github/workflows/build-godot-web.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trikaal-godot-web
  cancel-in-progress: true
jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TRIKAAL
        uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install matching export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -o templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Import and validate project
        run: godot --headless --editor --path godot-game --import
      - name: Export playable Web build
        run: |
          mkdir -p game
          godot --headless --path godot-game --export-release "Web" "$GITHUB_WORKSPACE/game/index.html"
          test -s game/index.html
      - name: Publish game files to GitHub Pages source
        run: |
          touch game/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/
          if git diff --cached --quiet; then
            echo "No game build changes."
          else
            git commit -m "Publish playable TRIKAAL web game"
            git push origin HEAD:main
          fi
