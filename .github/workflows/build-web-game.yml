name: Build playable TRIKAAL web game

on:
  push:
    branches: [main]
    paths:
      - 'godot-game/**'
      - '.github/workflows/build-web-game.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trikaal-web-game
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TRIKAAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.2 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Validate project and export Web build
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path godot-game --editor --quit
          mkdir -p site-game
          "$GODOT" --headless --path godot-game --export-release "Web" "$GITHUB_WORKSPACE/site-game/index.html"

      - name: Add browser launch page and deployment marker
        shell: bash
        run: |
          set -euo pipefail
          test -s site-game/index.html
          cat > site-game/README.txt <<'EOF'
TRIKAAL Web Game build.
Open https://ravime0099-arch.github.io/TRIKAAL-Character-Studio/game/
EOF
          touch site-game/.nojekyll

      - name: Publish game files to the existing Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site-game
          if git diff --cached --quiet; then
            echo "No web game changes to publish."
          else
            git commit -m "Build playable TRIKAAL web game"
            git push origin HEAD:main
          fi
